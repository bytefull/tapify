# Route UART0 to stdin/stdout so the shell prompt is visible in the terminal
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
# Disable shell log backend to avoid duplicate logs on the same UART0/stdout
CONFIG_SHELL_LOG_BACKEND=n
# Allow DBG logs through the runtime filter (default is INF which drops DBG)
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4

# GPIO
CONFIG_GPIO=y

# Networking (offloaded)
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=131072

# HTTP Server
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=4096

# Settings
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_NATIVE_MOUNT=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/settings/settings.bin"